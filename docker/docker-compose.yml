services:
  postgres:
    image: postgres:latest
    container_name: money_manager_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: money_manager
      POSTGRES_USER: money_manager
      POSTGRES_PASSWORD: money_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_manager -d money_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    container_name: money_manager_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend-dev:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: money_manager_backend_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgres://money_manager:money_manager@postgres:5432/money_manager
      JWT_SECRET: dev-change-me
      JWT_EXP_HOURS: 24
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@money-manager.local
      SMTP_STARTTLS: false
      EMAIL_VERIFICATION_URL_BASE: http://localhost:8000/api/v1/auth/verify-email
      PASSWORD_RESET_URL_BASE: http://localhost:8000/api/v1/auth/reset-password
      RUST_LOG: info,actix_web=info
    working_dir: /app
    command: cargo run
    volumes:
      - ..:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - target_cache:/app/target
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  cargo_registry:
  cargo_git:
  target_cache:
