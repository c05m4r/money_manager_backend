[package]
name = "migrations"
version = "0.1.0"
edition = "2024"
authors = ["Marcos Gabriel Miller"]
license = "GPL-3.0"

[lib]
name = "migrations"
path = "src/lib.rs"

[dependencies]
sea-orm-migration = { version = "1.1.19", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.22", features = ["v7", "serde"] }
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
dotenvy = "0.15.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
seed_defaults = { path = "../seed_defaults" }
